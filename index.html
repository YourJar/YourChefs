<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIT Vellore — Wayfinder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* =====================================================
         TOKENS
         A drafting-table palette: dark blueprint navy for
         chrome, pale drafting paper for the floor plan itself,
         amber for the marked route (like a highlighter on a
         printed plan).
         ===================================================== */
      :root {
        --ink: #0e1e38;
        --ink-soft: #16305a;
        --ink-line: #2a4a78;
        --paper: #eef3f8;
        --paper-line: #345272;
        --paper-line-soft: #c9d6e5;
        --paper-fill: #e3ebf4;
        --route: #f2a93b;
        --route-deep: #c9861f;
        --destination: #e15a4c;
        --stop: #1fa2a6;
        --text-on-ink: #e9eefb;
        --text-on-ink-dim: #93a6c9;
        --text-on-paper: #1a2c47;
        --font-ui: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font-ui);
        background: var(--ink);
        color: var(--text-on-ink);
        overflow: hidden;
      }

      button,
      input {
        font-family: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--route);
        outline-offset: 2px;
      }

      /* =====================================================
         APP SHELL
         ===================================================== */

      #app {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }

      .app-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--ink-line);
        background: var(--ink);
        z-index: 30;
      }

      .brand-mark {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
      }

      .brand-text h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .brand-text p {
        margin: 1px 0 0;
        font-size: 12px;
        color: var(--text-on-ink-dim);
      }

      #app-content {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
      }

      /* =====================================================
         MAP PANEL
         ===================================================== */

      .map-panel {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        background: var(--paper);
      }

      #mapStage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #outdoorView {
        position: absolute;
        inset: 0;
        background-image: url("/campus_map.png");
        background-size: cover;
        background-position: center;
        transform-origin: 20% 20%;
        transition:
          transform 1.4s ease-in,
          opacity 0.6s ease-in 1s;
      }

      #outdoorView.zoomed {
        transform: scale(6);
        opacity: 0;
      }

      #campusMap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--paper);
      }

      .campus-block {
        cursor: pointer;
      }

      .campus-block-shape {
        fill: var(--paper-fill);
        stroke: var(--paper-line);
        stroke-width: 3;
        transition:
          fill 0.15s ease,
          stroke 0.15s ease;
      }

      .campus-block:hover .campus-block-shape {
        fill: #fde8c2;
        stroke: var(--route);
      }

      /* C Block is an open semi-hexagon.  Never let the hover fill
         close its open outline with an SVG diagonal. */
      .campus-block:hover .campus-open-fill {
        fill: #fde8c2;
      }

      .campus-block:hover .campus-open-outline {
        fill: #fde8c2 !important;
        stroke: var(--route);
      }

      .campus-entrance-line {
        stroke: var(--route);
        stroke-width: 8;
        stroke-linecap: round;
      }

      .campus-entrance-label {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 600;
        fill: var(--route-deep);
      }

      .campus-block-label {
        font-family: var(--font-ui);
        font-size: 19px;
        font-weight: 600;
        fill: var(--text-on-paper);
        pointer-events: none;
      }

      /* Campus is one continuous large footprint. Walkways are
         deliberately straight/angled, like the supplied sketch. */
      .campus-mass {
        fill: var(--paper-fill);
        stroke: var(--paper-line);
        stroke-width: 3;
        stroke-linejoin: round;
      }

      .campus-zone {
        fill: transparent;
        stroke: transparent;
        cursor: pointer;
        pointer-events: all;
      }

      .campus-zone:hover {
        fill: rgba(242, 169, 59, 0.12);
        stroke: rgba(242, 169, 59, 0.55);
        stroke-width: 2;
      }

      .campus-link {
        stroke: var(--paper-line);
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .campus-link-inner {
        stroke: var(--paper);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .outdoor-route-line {
        stroke: var(--route);
        stroke-width: 8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 1;
        pointer-events: stroke;
        cursor: pointer;
      }

      .outdoor-route-line:hover {
        stroke-width: 9;
      }

      .outdoor-route-arrow {
        fill: var(--route);
        stroke: none;
      }

      .route-line-arrow {
        fill: var(--route);
        stroke: none;
      }
      .outdoor-route-layer {
        pointer-events: none;
      }

      .outdoor-route-layer .outdoor-route-line {
        pointer-events: stroke;
      }

      .outdoor-start-dot {
        fill: var(--route);
        stroke: #fff;
        stroke-width: 3;
      }

      .outdoor-end-dot {
        fill: var(--destination);
        stroke: #fff;
        stroke-width: 3;
      }

      #indoorView {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        background: var(--paper);
        transition: opacity 0.6s ease-in;
      }

      #indoorView {
        pointer-events: none;
      }

      #indoorView.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .map-toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 12px 14px 10px;
        background: var(--paper);
        border-bottom: 1px solid var(--paper-line-soft);
      }

      #buildingTabs,
      #floorTabs {
        width: 100%;
      }

      .tab-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        padding: 6px 13px;
        border-radius: 7px;
        border: 1px solid var(--paper-line-soft);
        background: #fff;
        color: var(--text-on-paper);
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .tab:hover {
        border-color: var(--route);
      }

      .tab.active {
        background: var(--ink);
        color: var(--text-on-ink);
        border-color: var(--ink);
      }

      .map-canvas {
        flex: 1;
        min-height: 0;
        position: relative;
        background-image:
          linear-gradient(var(--paper-line-soft) 1px, transparent 1px),
          linear-gradient(90deg, var(--paper-line-soft) 1px, transparent 1px);
        background-size: 24px 24px;
        background-position: center;
      }

      #floorMap {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* =====================================================
         SIDEBAR / CARDS
         ===================================================== */

      .sidebar {
        flex: 0 0 380px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        overflow-y: auto;
        background: var(--ink);
        border-left: 1px solid var(--ink-line);
      }

      .card {
        background: var(--ink-soft);
        border: 1px solid var(--ink-line);
        border-radius: 10px;
        padding: 14px 16px;
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--text-on-ink-dim);
        text-transform: uppercase;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 12px;
      }

      .field:last-of-type {
        margin-bottom: 14px;
      }

      .field label {
        font-size: 12.5px;
        color: var(--text-on-ink-dim);
      }

      .field input {
        padding: 9px 10px;
        border-radius: 7px;
        border: 1px solid var(--ink-line);
        background: #0b1830;
        color: var(--text-on-ink);
        font-size: 14px;
      }

      .field input::placeholder {
        color: #5a6f95;
      }

      .field input:focus {
        border-color: var(--route);
      }

      #findPathBtn {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 7px;
        background: var(--route);
        color: #26190a;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      #findPathBtn:hover {
        background: var(--route-deep);
      }

      /* -----------------------------------------------------
         CURRENT LOCATION
         ----------------------------------------------------- */

      #currentLocation {
        display: none;
      }

      #currentBlock {
        font-family: var(--font-mono);
        font-size: 19px;
        font-weight: 600;
        color: var(--route);
      }

      #currentFloor {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--text-on-ink-dim);
        margin-top: 4px;
      }

      #backBtn {
        display: none;
        width: 100%;
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 7px;
        border: 1px solid var(--ink-line);
        background: #0b1830;
        color: var(--text-on-ink);
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      #backBtn:hover {
        border-color: var(--route);
      }

      /* -----------------------------------------------------
         DIRECTIONS / ROUTE OPTIONS
         ----------------------------------------------------- */

      #routeOptions {
        display: none;
        margin-bottom: 12px;
        font-size: 12.5px;
      }

      #routeOptions strong {
        display: block;
        font-weight: 600;
        color: var(--text-on-ink-dim);
        margin-bottom: 6px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #routeOptions button {
        padding: 6px 12px;
        margin: 0 6px 6px 0;
        border-radius: 6px;
        border: 1px solid var(--ink-line);
        background: #0b1830;
        color: var(--text-on-ink);
        font-size: 12.5px;
        cursor: pointer;
      }

      #routeOptions button.active {
        background: var(--route);
        border-color: var(--route);
        color: #26190a;
        font-weight: 600;
      }

      #result {
        margin: 0;
        white-space: pre-line;
        font-size: 13.5px;
        line-height: 1.65;
        color: var(--text-on-ink);
      }

      #result:empty::before,
      #result.placeholder::before {
        content: "Enter a starting room and a destination to get turn-by-turn directions.";
        color: var(--text-on-ink-dim);
      }

      #navigationMessage {
        margin: 10px 0 0;
        font-size: 12.5px;
        color: var(--stop);
        min-height: 1em;
      }

      /* =====================================================
         SVG CONTENT (drawn by JS, classes styled here)
         ===================================================== */

      .room-square {
        cursor: pointer;
        transition: fill 0.1s ease;
      }

      .room-square:hover {
        fill: #fde8c2 !important;
        stroke: var(--route) !important;
      }

      .route-line {
        cursor: pointer;
        pointer-events: stroke;
        stroke-linecap: square;
      }

      .route-line:hover {
        stroke-width: 5;
      }

      .floor-transition {
        cursor: pointer;
      }

      .floor-transition:hover {
        opacity: 0.75;
      }

      .floor-transition-line {
        stroke: var(--route);
        stroke-width: 3;
        stroke-linecap: square;
      }

      .floor-transition-text {
        font-family: var(--font-mono);
        font-size: 18px;
        font-weight: 700;
        fill: var(--route-deep);
        text-anchor: middle;
      }

      .destination-pulse {
        animation: destinationPulse 1.2s infinite;
      }

      @keyframes destinationPulse {
        0% {
          r: 9;
          opacity: 1;
        }
        50% {
          r: 15;
          opacity: 0.45;
        }
        100% {
          r: 9;
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #outdoorView,
        #indoorView {
          transition: none !important;
        }
        .destination-pulse {
          animation: none;
        }
      }

      /* =====================================================
         RESPONSIVE: below ~880px the sidebar becomes a
         bottom sheet floating over a full-bleed map, matching
         the conventions of a mobile navigation app.
         ===================================================== */

      @media (max-width: 880px) {
        .app-header {
          padding: 12px 16px;
        }

        #app-content {
          display: block;
        }

        .map-panel {
          position: absolute;
          inset: 0;
        }

        .sidebar {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          flex: none;
          max-height: 62dvh;
          border-left: none;
          border-top: 1px solid var(--ink-line);
          border-radius: 16px 16px 0 0;
          box-shadow: 0 -8px 24px rgba(4, 10, 24, 0.45);
        }

        .sidebar::before {
          content: "";
          display: block;
          width: 36px;
          height: 4px;
          border-radius: 2px;
          background: var(--ink-line);
          margin: 2px auto 10px;
        }
      }

      @media (min-width: 881px) {
        .sidebar {
          height: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <!-- ===================================================
           HEADER
           =================================================== -->

      <header class="app-header">
        <svg
          class="brand-mark"
          viewBox="0 0 32 32"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z"
            stroke="#f2a93b"
            stroke-width="2"
          />
          <circle cx="16" cy="16" r="3" fill="#f2a93b" />
        </svg>
        <div class="brand-text">
          <h1>VIT Vellore</h1>
          <p>Campus wayfinder</p>
        </div>
      </header>

      <!-- ===================================================
           CONTENT
           =================================================== -->

      <div id="app-content">
        <div class="map-panel">
          <div id="mapStage">
            <div id="outdoorView">
              <svg
                id="campusMap"
                viewBox="0 0 1000 900"
                preserveAspectRatio="xMidYMid meet"
              ></svg>
            </div>

            <div id="indoorView">
              <div class="map-toolbar">
                <div id="buildingTabs" class="tab-row"></div>
                <div id="floorTabs" class="tab-row"></div>
              </div>

              <div class="map-canvas">
                <svg
                  id="floorMap"
                  viewBox="0 0 1400 900"
                  preserveAspectRatio="xMidYMid meet"
                ></svg>
              </div>
            </div>
          </div>
        </div>

        <aside class="sidebar">
          <div class="card">
            <h2>Plan a route</h2>

            <div class="field">
              <label for="from">From</label>
              <input id="from" placeholder="e.g. 43" />
            </div>

            <div class="field">
              <label for="via">Stop (optional)</label>
              <input id="via" placeholder="e.g. 118" />
            </div>

            <div class="field">
              <label for="to">To</label>
              <input id="to" placeholder="e.g. 101" />
            </div>

            <button id="findPathBtn" onclick="findPath()">Find route</button>
          </div>

          <div class="card" id="currentLocation">
            <h2>Current location</h2>
            <div id="currentBlock">Current Block:</div>
            <div id="currentFloor">Current Floor:</div>
            <button id="backBtn" type="button"></button>
          </div>

          <div class="card">
            <h2>Directions</h2>
            <div id="routeOptions"></div>
            <p id="result"></p>
            <p id="navigationMessage"></p>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const svgns = "http://www.w3.org/2000/svg";

      let floorNodes = {};

      let floorEdges = [];

      let currentBuilding = null;

      let currentFloor = null;

      let lastPathCoords = [];

      // Stack of {building, floor} the user has moved away from,
      // most recent last, so "Back" can retrace their steps one
      // move at a time. Cleared whenever a fresh route is found.
      let navigationHistory = [];

      let buildingLayout = {};

      let campusLayoutData = null;

      let selectedRouteMode = "indoor";

      const buildingLabels = {
        A: "A Block",

        B: "B Block",

        D: "D Block",

        E: "E Block",

        C: "C Block",
      };

      // =========================================================
      // FLOOR NAME
      // =========================================================

      function getFloorName(floor) {
        if (floor === 0) {
          return "Ground Floor";
        }

        if (floor === 1) {
          return "1st Floor";
        }

        if (floor === 2) {
          return "2nd Floor";
        }

        if (floor === 3) {
          return "3rd Floor";
        }

        return floor + "th Floor";
      }

      // =========================================================
      // CURRENT LOCATION
      // =========================================================

      function updateCurrentLocation() {
        if (!currentBuilding || currentFloor === null) {
          document.getElementById("currentLocation").style.display = "none";

          return;
        }

        document.getElementById("currentBlock").innerText =
          "Current Block: " +
          (buildingLabels[currentBuilding] || currentBuilding);

        document.getElementById("currentFloor").innerText =
          "Current Floor: " + getFloorName(currentFloor);

        document.getElementById("currentLocation").style.display = "block";
      }

      // =========================================================
      // HIDE LOCATION
      // =========================================================

      function hideCurrentLocation() {
        document.getElementById("currentLocation").style.display = "none";
      }

      // =========================================================
      // NAVIGATION HISTORY (BACK BUTTON)
      // =========================================================

      // Call this BEFORE currentBuilding/currentFloor are changed,
      // so the place being left is what gets remembered.
      function recordVisitedFloor() {
        if (!currentBuilding || currentFloor === null) {
          return;
        }

        navigationHistory.push({
          building: currentBuilding,
          floor: currentFloor,
        });

        updateBackButton();
      }

      function updateBackButton() {
        const btn = document.getElementById("backBtn");

        if (navigationHistory.length === 0) {
          btn.style.display = "none";
          return;
        }

        const previous = navigationHistory[navigationHistory.length - 1];

        btn.textContent = `← Back to ${
          buildingLabels[previous.building] || previous.building
        }, ${getFloorName(previous.floor)}`;

        btn.style.display = "block";
      }

      function goBack() {
        if (navigationHistory.length === 0) {
          return;
        }

        const previous = navigationHistory.pop();

        currentBuilding = previous.building;

        currentFloor = previous.floor;

        updateCurrentLocation();

        renderBuildingTabs();

        renderFloorTabs();

        loadFloor();

        updateBackButton();

        document.getElementById("navigationMessage").innerText =
          `Back to ${buildingLabels[currentBuilding]}, ${getFloorName(currentFloor)}.`;
      }

      // =========================================================
      // CAMPUS OVERVIEW (outdoor, whole-campus view)
      //
      // A big SVG drawn from /campus_layout: each block as a
      // hexagon-ish shape, joined by a single curved line per
      // connection - so the wings and pods read as one connected
      // chain, echoing the campus's real footprint, rather than a
      // flat photo with no sense of how the blocks relate.
      // =========================================================

      function hexagonPoints(cx, cy, w, h) {
        const hw = w / 2;

        const hh = h / 2;

        const notch = Math.min(hw, hh) * 0.42;

        return [
          [cx - hw + notch, cy - hh],
          [cx + hw - notch, cy - hh],
          [cx + hw, cy],
          [cx + hw - notch, cy + hh],
          [cx - hw + notch, cy + hh],
          [cx - hw, cy],
        ]
          .map((point) => point.join(","))
          .join(" ");
      }

      function semiHexagonPoints(cx, cy, w, h) {
        const hw = w / 2;
        const hh = h / 2;
        // C Block is a closed, vertically oriented hexagonal footprint.
        // Its room/entrance arrangement is handled separately in the floor view.
        return [
          [cx - hw * 0.58, cy - hh],
          [cx + hw * 0.58, cy - hh],
          [cx + hw, cy - hh * 0.15],
          [cx + hw * 0.62, cy + hh],
          [cx - hw * 0.62, cy + hh],
          [cx - hw, cy - hh * 0.15],
        ];
      }

      function drawOpenSemiHexagon(group, building) {
        const points = semiHexagonPoints(
          building.cx,
          building.cy,
          building.w,
          building.h,
        );

        // C is a CLOSED campus footprint. The room/entrance arrangement is
        // shown in the floor view; the top view keeps C as one complete block.
        const polygon = document.createElementNS(svgns, "polygon");
        polygon.setAttribute(
          "points",
          points.map((point) => point.join(",")).join(" "),
        );
        polygon.classList.add("campus-block-shape", "campus-open-outline");
        group.appendChild(polygon);
      }

      function campusConnectionPoints(a, b) {
        // Attach walkways to the visible edge of each block instead of
        // drawing them through the building itself. C uses its centred
        // entrance as the attachment point because its lower side is open.
        function anchor(building, other) {
          if (building.kind === "semihex_open") {
            // C's outdoor connectors attach to its upper-left / upper-right
            // edges, just like the E-D and A-B connectors attach to block edges.
            const dx = other.cx - building.cx;
            const hw = building.w / 2;
            const hh = building.h / 2;
            if (dx < 0) {
              return {
                x: building.cx - hw * 0.58,
                y: building.cy - hh,
              };
            }
            return {
              x: building.cx + hw * 0.58,
              y: building.cy - hh,
            };
          }

          const dx = other.cx - building.cx;
          const dy = other.cy - building.cy;
          const hw = building.w / 2;
          const hh = building.h / 2;

          if (Math.abs(dx) >= Math.abs(dy)) {
            return {
              x: building.cx + (dx >= 0 ? hw : -hw),
              y: building.cy,
            };
          }

          return {
            x: building.cx,
            y: building.cy + (dy >= 0 ? hh : -hh),
          };
        }

        return {
          start: anchor(a, b),
          end: anchor(b, a),
        };
      }

      function drawCampusConnections(svg, buildings, connections) {
        const byId = {};
        buildings.forEach((building) => {
          byId[building.id] = building;
        });

        // Always show the physical block-to-block connections on the campus view.
        // Use the backend connections when available, with the actual campus
        // chain as a fallback so the connectors are still visible if the API
        // returns an empty connection list.
        const visibleConnections =
          Array.isArray(connections) && connections.length > 0
            ? connections
            : [
                { from: "E", to: "D" },
                { from: "D", to: "C" },
                { from: "C", to: "B" },
                { from: "B", to: "A" },
              ];

        visibleConnections.forEach((connection) => {
          const a = byId[connection.from];
          const b = byId[connection.to];
          if (!a || !b) return;

          const points = campusConnectionPoints(a, b);
          const pathData = `M ${points.start.x} ${points.start.y} L ${points.end.x} ${points.end.y}`;

          const outer = document.createElementNS(svgns, "path");
          outer.setAttribute("d", pathData);
          outer.setAttribute("class", "campus-link");
          outer.style.pointerEvents = "none";
          svg.appendChild(outer);

          const inner = document.createElementNS(svgns, "path");
          inner.setAttribute("d", pathData);
          inner.setAttribute("class", "campus-link-inner");
          inner.style.pointerEvents = "none";
          svg.appendChild(inner);
        });
      }

      function drawCampusBuildings(svg, buildings) {
        buildings.forEach((building) => {
          const group = document.createElementNS(svgns, "g");
          group.setAttribute("class", "campus-block");
          group.setAttribute("data-building", building.id);

          group.addEventListener("click", () => enterBuilding(building.id));

          if (building.kind === "semihex_open") {
            drawOpenSemiHexagon(group, building);
          } else {
            const polygon = document.createElementNS(svgns, "polygon");
            polygon.setAttribute(
              "points",
              hexagonPoints(building.cx, building.cy, building.w, building.h),
            );
            polygon.classList.add("campus-block-shape");
            group.appendChild(polygon);
          }

          const label = document.createElementNS(svgns, "text");
          label.setAttribute("x", building.cx);
          label.setAttribute("y", building.cy + 7);
          label.setAttribute("text-anchor", "middle");
          label.classList.add("campus-block-label");
          label.textContent = building.name;
          group.appendChild(label);

          svg.appendChild(group);
        });
      }

      function clearOutdoorRoute() {
        const existing = document.getElementById("outdoorRouteLayer");
        if (existing) {
          existing.remove();
        }
      }

      function drawOutdoorRouteSegment(svg, a, b, index) {
        const layer = document.getElementById("outdoorRouteLayer");
        if (!layer) return;

        const points = campusConnectionPoints(a, b);
        const start = points.start;
        const end = points.end;

        const path = document.createElementNS(svgns, "path");
        path.setAttribute("d", `M ${start.x} ${start.y} L ${end.x} ${end.y}`);
        path.setAttribute("class", "outdoor-route-line");
        path.addEventListener("click", (event) => {
          event.stopPropagation();
          showDestination();
        });
        layer.appendChild(path);

        // Draw several real arrowheads along the route. SVG marker-end
        // only gives one head and can disappear at a block boundary.
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const length = Math.hypot(dx, dy) || 1;
        const ux = dx / length;
        const uy = dy / length;
        const angle = Math.atan2(dy, dx);
        // Keep a single direction arrow at the exact centre of the line.
        // This makes the direction readable without visually favouring either end.
        const positions = [0.5];

        positions.forEach((ratio) => {
          const x = start.x + dx * ratio;
          const y = start.y + dy * ratio;
          const size = 14;
          const half = 7;
          const tipX = x + ux * size;
          const tipY = y + uy * size;
          const backX = x - ux * 2;
          const backY = y - uy * 2;
          const px = -uy;
          const py = ux;

          const arrow = document.createElementNS(svgns, "polygon");
          arrow.setAttribute(
            "points",
            `${tipX},${tipY} ${backX + px * half},${backY + py * half} ${backX - px * half},${backY - py * half}`,
          );
          arrow.setAttribute("class", "outdoor-route-arrow");
          arrow.style.pointerEvents = "none";
          layer.appendChild(arrow);
        });
      }

      function createCampusRouteArrowMarker(svg) {
        if (svg.querySelector("#campusRouteArrow")) {
          return;
        }

        const defs = document.createElementNS(svgns, "defs");
        const marker = document.createElementNS(svgns, "marker");
        marker.setAttribute("id", "campusRouteArrow");
        marker.setAttribute("markerWidth", "13");
        marker.setAttribute("markerHeight", "13");
        marker.setAttribute("refX", "13");
        marker.setAttribute("refY", "6.5");
        marker.setAttribute("viewBox", "0 0 13 13");
        marker.setAttribute("orient", "auto");
        marker.setAttribute("markerUnits", "userSpaceOnUse");

        const arrow = document.createElementNS(svgns, "path");
        arrow.setAttribute("d", "M0,2 L13,6.5 L0,11 Z");
        arrow.setAttribute("fill", "#f2a93b");
        marker.appendChild(arrow);
        defs.appendChild(marker);
        svg.appendChild(defs);
      }

      function highlightOutdoorPath() {
        const svg = document.getElementById("campusMap");
        if (!svg || !campusLayoutData || !lastPathCoords.length) {
          return;
        }

        clearOutdoorRoute();
        createCampusRouteArrowMarker(svg);

        const layer = document.createElementNS(svgns, "g");
        layer.setAttribute("id", "outdoorRouteLayer");
        layer.classList.add("outdoor-route-layer");
        svg.appendChild(layer);

        const byId = {};
        campusLayoutData.buildings.forEach((building) => {
          byId[building.id] = building;
        });

        const buildingSequence = [];
        lastPathCoords.forEach((point) => {
          if (!buildingSequence.includes(point.building)) {
            buildingSequence.push(point.building);
          }
        });

        for (let i = 0; i < buildingSequence.length - 1; i++) {
          const from = byId[buildingSequence[i]];
          const to = byId[buildingSequence[i + 1]];
          if (from && to) {
            drawOutdoorRouteSegment(svg, from, to, i);
          }
        }

        // Mark the first and last buildings so the outdoor route is
        // immediately understandable without opening a floor map.
        const startBuilding = byId[buildingSequence[0]];
        const endBuilding = byId[buildingSequence[buildingSequence.length - 1]];

        [
          {
            building: startBuilding,
            className: "outdoor-start-dot",
            label: "Start",
          },
          {
            building: endBuilding,
            className: "outdoor-end-dot",
            label: "Destination",
          },
        ].forEach((item) => {
          if (!item.building) return;
          const dot = document.createElementNS(svgns, "circle");
          dot.setAttribute("cx", item.building.cx);
          dot.setAttribute("cy", item.building.cy);
          dot.setAttribute("r", "9");
          dot.setAttribute("class", item.className);
          layer.appendChild(dot);
        });
      }

      function loadCampusLayout() {
        fetch("/campus_layout")
          .then((response) => response.json())

          .then((data) => {
            const svg = document.getElementById("campusMap");

            if (!svg) {
              return;
            }

            svg.setAttribute(
              "viewBox",
              `0 0 ${data.canvas.width} ${data.canvas.height}`,
            );

            campusLayoutData = data;

            svg.innerHTML = "";

            // Draw the campus in the same block layout as the reference:
            // each block remains a distinct building, while the walkways
            // between them are straight, double-line connections.
            // This keeps the first page easy to understand and clickable.
            drawCampusConnections(svg, data.buildings, data.connections);
            drawCampusBuildings(svg, data.buildings);
          })

          .catch((error) => {
            console.error(error);
          });
      }

      // =========================================================
      // ENTER BUILDING FROM CAMPUS OVERVIEW
      // =========================================================

      function enterBuilding(buildingId) {
        if (!buildingLayout[buildingId]) {
          return;
        }

        const wasOutdoorRoute =
          selectedRouteMode === "outdoor" && lastPathCoords.length > 0;

        navigationHistory = [];
        currentBuilding = buildingId;
        currentFloor = buildingLayout[buildingId][0];

        // Keep the calculated outdoor path when entering a block so the
        // indoor view can show the corresponding entrance/stair arrow.
        if (!wasOutdoorRoute) {
          lastPathCoords = [];
          clearOutdoorRoute();
        } else {
          clearOutdoorRoute();
        }

        updateBackButton();
        updateCurrentLocation();
        renderBuildingTabs();
        renderFloorTabs();
        loadFloor();

        document.getElementById("routeOptions").style.display = wasOutdoorRoute
          ? "block"
          : "none";
        document.getElementById("navigationMessage").innerText = wasOutdoorRoute
          ? "Follow the amber arrow through this block."
          : "";

        playZoomTransition(currentBuilding);
      }

      // =========================================================
      // LOAD BUILDINGS
      // =========================================================

      function loadBuildings() {
        fetch("/buildings")
          .then((response) => response.json())

          .then((data) => {
            buildingLayout = data;

            currentBuilding = null;

            currentFloor = null;

            navigationHistory = [];

            hideCurrentLocation();

            document.getElementById("buildingTabs").innerHTML = "";

            document.getElementById("floorTabs").innerHTML = "";
          });
      }

      // =========================================================
      // BUILDING TABS
      // =========================================================

      function renderBuildingTabs() {
        const container = document.getElementById("buildingTabs");

        container.innerHTML = "";

        if (!currentBuilding) {
          return;
        }

        const buildingOrder = ["A", "B", "C", "D", "E"];

        buildingOrder
          .filter((buildingId) => buildingLayout[buildingId])
          .forEach((buildingId) => {
            const tab = document.createElement("span");

            tab.className =
              "tab" + (buildingId === currentBuilding ? " active" : "");

            tab.textContent = buildingLabels[buildingId];

            tab.onclick = () => {
              if (buildingId === currentBuilding) {
                return;
              }

              recordVisitedFloor();

              currentBuilding = buildingId;

              currentFloor = buildingLayout[buildingId][0];

              updateCurrentLocation();

              renderBuildingTabs();

              renderFloorTabs();

              loadFloor();
            };

            container.appendChild(tab);
          });
      }

      // =========================================================
      // FLOOR TABS
      // =========================================================

      function renderFloorTabs() {
        const container = document.getElementById("floorTabs");

        container.innerHTML = "";

        if (!currentBuilding) {
          return;
        }

        const floors = buildingLayout[currentBuilding] || [];

        floors.forEach((floorNum) => {
          const tab = document.createElement("span");

          tab.className = "tab" + (floorNum === currentFloor ? " active" : "");

          tab.textContent = getFloorName(floorNum);

          tab.onclick = () => {
            if (floorNum === currentFloor) {
              return;
            }

            recordVisitedFloor();

            currentFloor = floorNum;

            updateCurrentLocation();

            renderFloorTabs();

            loadFloor();
          };

          container.appendChild(tab);
        });
      }

      // =========================================================
      // LOAD FLOOR
      // =========================================================

      function loadFloor() {
        if (!currentBuilding || currentFloor === null) {
          return;
        }

        fetch(
          `/floor?building=${encodeURIComponent(
            currentBuilding,
          )}&floor=${currentFloor}`,
        )
          .then((response) => response.json())

          .then((data) => {
            if (data.error) {
              console.error(data.error);

              return;
            }

            floorNodes = {};

            data.nodes.forEach((node) => {
              floorNodes[node.name] = {
                x: node.x,

                y: node.y,

                type: node.type,

                room_number: node.room_number,
              };
            });

            floorEdges = data.edges;

            drawBaseMap();

            if (lastPathCoords.length > 0) {
              highlightPathOnCurrentView();
            }
          });
      }

      // =========================================================
      // DRAW BASE MAP
      // =========================================================

      function drawBaseMap() {
        const svg = document.getElementById("floorMap");

        svg.innerHTML = "";

        svg.style.transform = "translate(0px, 0px) scale(1)";

        // -----------------------------------------------------
        // CORRIDORS
        // -----------------------------------------------------

        floorEdges.forEach((edge) => {
          const a = floorNodes[edge.from];

          const b = floorNodes[edge.to];

          if (!a || !b) {
            return;
          }

          // B and D ground floors have an entrance-to-stairs graph
          // connection for routing, but that connection should NOT be
          // drawn as a visible base-map corridor.  Keep the graph edge
          // intact so navigation still works; only hide this visual line.
          const hideGroundEntranceStairs =
            (currentBuilding === "B" || currentBuilding === "D") &&
            currentFloor === 0 &&
            ((a.type === "entrance" && b.type === "stairs") ||
              (a.type === "stairs" && b.type === "entrance"));

          if (hideGroundEntranceStairs) {
            return;
          }

          const line = document.createElementNS(svgns, "line");

          line.setAttribute("x1", a.x);

          line.setAttribute("y1", a.y);

          line.setAttribute("x2", b.x);

          line.setAttribute("y2", b.y);

          line.setAttribute("stroke", "#c9d6e5");

          line.setAttribute("stroke-width", "6");

          line.setAttribute("stroke-linecap", "square");

          svg.appendChild(line);
        });

        drawFloorNodes(svg);
      }

      // =========================================================
      // DRAW ROOM / STAIR / ENTRANCE NODES
      // Drawn again after the route so boxes cover line ends.
      // =========================================================

      function drawFloorNodes(svg) {

            label.setAttribute("y", pos.y);

            label.setAttribute("dominant-baseline", "central");

            label.setAttribute("font-family", "IBM Plex Mono, monospace");

          // ===============================================

          else if (pos.type === "stairs") {

            stair.setAttribute("x", pos.x - 21);

            stair.setAttribute("y", pos.y - 21);

            stair.setAttribute("width", "42");

            stair.setAttribute("height", "42");

            stair.setAttribute("rx", "4");

            stair.setAttribute("fill", "#f6e7c4");

            stair.setAttribute("stroke", "#8c6d1f");

            stair.setAttribute("stroke-width", "2");

            svg.appendChild(stair);

            const label = document.createElementNS(svgns, "text");

            label.setAttribute("x", pos.x);

            label.setAttribute("y", pos.y + 46);

            label.setAttribute("text-anchor", "middle");

            label.setAttribute("font-family", "IBM Plex Mono, monospace");

            label.setAttribute("font-size", "12");

            label.setAttribute("font-weight", "600");

            label.setAttribute("fill", "#5b4712");

            label.textContent = "STAIRS";

            svg.appendChild(label);
          }

          // ===============================================
          // ENTRANCE
          // ===============================================
          else if (
            pos.type === "entrance" &&
            !(
              (currentBuilding === "B" || currentBuilding === "D") &&

            )
          ) {

            entrance.setAttribute("x", pos.x - 18);

            entrance.setAttribute("y", pos.y - 18);

            entrance.setAttribute("width", "36");

            entrance.setAttribute("stroke", "#2f7a4d");

            entrance.setAttribute("stroke-width", "2");

            svg.appendChild(entrance);

            const label = document.createElementNS(svgns, "text");

            label.setAttribute("x", pos.x + 34);

            label.setAttribute("y", pos.y + 4);

            label.setAttribute("font-family", "Space Grotesk, sans-serif");

            label.setAttribute("font-size", "12");

            label.setAttribute("fill", "#1a2c47");

            label.textContent = "Entrance";

          }

      }

      // =========================================================
      // ARROW MARKER
      // =========================================================

      function createRouteArrowMarker(svg) {
        if (svg.querySelector("#routeArrow")) {
          return;
        }

        const defs = document.createElementNS(svgns, "defs");

        const marker = document.createElementNS(svgns, "marker");

        marker.setAttribute("id", "routeArrow");

        marker.setAttribute("markerWidth", "13");

        marker.setAttribute("markerHeight", "13");

        marker.setAttribute("refX", "13");

        marker.setAttribute("refY", "6.5");

        marker.setAttribute("viewBox", "0 0 13 13");

        marker.setAttribute("orient", "auto");

        marker.setAttribute("markerUnits", "userSpaceOnUse");

        const arrow = document.createElementNS(svgns, "path");

        arrow.setAttribute("d", "M0,2 L13,6.5 L0,11 Z");

        arrow.setAttribute("fill", "#f2a93b");

        marker.appendChild(arrow);

        defs.appendChild(marker);

        svg.appendChild(defs);
      }

      function pointKey(point) {
        if (point && point.name) {
          return String(point.name);
        }

        return Math.round(point.x) + "," + Math.round(point.y);
      }

      function corridorKey(a, b) {
        const left = pointKey(a);

        const right = pointKey(b);

        return left < right ? left + "::" + right : right + "::" + left;
      }

      function isCanonicalDirection(from, to) {
        const dx = to.x - from.x;

        const dy = to.y - from.y;

        if (Math.abs(dx) >= Math.abs(dy)) {
          return dx > 0 || (dx === 0 && dy >= 0);
        }

        return dy > 0;
      }

      // =========================================================
      // DRAW FLOOR TRANSITION
      // =========================================================

      function drawFloorTransition(svg, point, nextFloor) {
        const direction = nextFloor > currentFloor ? 1 : -1;

        const arrowLength = 58;

        const x = point.x;

        const startY = point.y;

        const endY = point.y - direction * arrowLength;

        const line = document.createElementNS(svgns, "line");

        line.setAttribute("x1", x);

        line.setAttribute("y1", startY);

        line.setAttribute("x2", x);

        line.setAttribute("y2", endY);

        line.setAttribute("class", "floor-transition-line");

        line.setAttribute("marker-end", "url(#routeArrow)");

        svg.appendChild(line);

        const text = document.createElementNS(svgns, "text");

        text.setAttribute("x", x + 36);

        text.setAttribute("y", endY + 4);

        text.setAttribute("class", "floor-transition-text");

        text.textContent = `Go to ${getFloorName(nextFloor)}`;

        svg.appendChild(text);

        const group = document.createElementNS(svgns, "g");

        group.classList.add("floor-transition");

        group.addEventListener("click", () => {
          moveToFloor(nextFloor);
        });

        const hitArea = document.createElementNS(svgns, "rect");

        hitArea.setAttribute("x", x - 25);

        hitArea.setAttribute("y", Math.min(startY, endY) - 10);

        hitArea.setAttribute("width", "50");

        hitArea.setAttribute("height", Math.abs(endY - startY) + 20);

        hitArea.setAttribute("fill", "transparent");

        group.appendChild(hitArea);

        svg.appendChild(group);
      }

      // =========================================================
      // MOVE TO NEXT FLOOR
      // =========================================================

      function moveToFloor(nextFloor) {
        recordVisitedFloor();

        currentFloor = nextFloor;

        updateCurrentLocation();

        renderFloorTabs();

        loadFloor();

        document.getElementById("navigationMessage").innerText =
          `Moved to ${getFloorName(nextFloor)}.`;
      }

      // =========================================================
      // OUTDOOR BUILDING TRANSITION
      // =========================================================

      function drawBuildingTransition(svg, point, nextBuilding, routeType) {
        const endX = point.x + 82;

        const line = document.createElementNS(svgns, "line");

        line.setAttribute("x1", point.x);
        line.setAttribute("y1", point.y);
        line.setAttribute("x2", endX);
        line.setAttribute("y2", point.y);
        line.setAttribute("class", "floor-transition-line");
        line.setAttribute("marker-end", "url(#routeArrow)");

        svg.appendChild(line);

        const text = document.createElementNS(svgns, "text");

        text.setAttribute("x", endX + 105);
        text.setAttribute("y", point.y - 8);
        text.setAttribute("class", "floor-transition-text");
        text.textContent =
          routeType === "covered"
            ? `Continue indoors to ${buildingLabels[nextBuilding]}`
            : `Walk outside to ${buildingLabels[nextBuilding]}`;

        svg.appendChild(text);

        const group = document.createElementNS(svgns, "g");

        group.classList.add("floor-transition");
        group.addEventListener("click", () => {
          moveToBuilding(nextBuilding);
        });

        const hitArea = document.createElementNS(svgns, "rect");

        hitArea.setAttribute("x", point.x - 12);
        hitArea.setAttribute("y", point.y - 26);
        hitArea.setAttribute("width", 250);
        hitArea.setAttribute("height", 48);
        hitArea.setAttribute("fill", "transparent");

        group.appendChild(hitArea);
        svg.appendChild(group);
      }

      function moveToBuilding(nextBuilding) {
        const nextPoint = lastPathCoords.find(
          (point) => point.building === nextBuilding,
        );

        recordVisitedFloor();

        currentBuilding = nextBuilding;
        currentFloor = nextPoint ? nextPoint.floor : 0;

        updateCurrentLocation();
        renderBuildingTabs();
        renderFloorTabs();
        loadFloor();

        document.getElementById("navigationMessage").innerText =
          `Moved outside to ${buildingLabels[nextBuilding]}.`;
      }

      // =========================================================
      // DRAW ROUTE
      // =========================================================

      function highlightPathOnCurrentView() {
        const svg = document.getElementById("floorMap");

        const onThisView = lastPathCoords.filter(
          (p) => p.building === currentBuilding && p.floor === currentFloor,
        );

        if (onThisView.length === 0) {
          return;
        }

        createRouteArrowMarker(svg);

        const segmentTotals = {};

        const sameFloorSegments = [];

        for (let i = 0; i < onThisView.length - 1; i++) {
          const from = onThisView[i];

          const to = onThisView[i + 1];

          if (from.building !== to.building || from.floor !== to.floor) {
            continue;
          }

          const key = corridorKey(from, to);

          segmentTotals[key] = (segmentTotals[key] || 0) + 1;

          sameFloorSegments.push({ from, to, key });
        }

        const ONE_WAY_OFFSET = 7;

        const TWO_WAY_OFFSET = 11;

        // -----------------------------------------------------
        // 1. Draw route line segments.
        // -----------------------------------------------------

        sameFloorSegments.forEach((segment) => {
          const from = segment.from;

          const to = segment.to;

          const dx = to.x - from.x;

          const dy = to.y - from.y;

          const length = Math.sqrt(dx * dx + dy * dy) || 1;

          const isTwoWay = segmentTotals[segment.key] > 1;

          const forward = isCanonicalDirection(from, to);

          const lane = isTwoWay
            ? forward
              ? TWO_WAY_OFFSET
              : -TWO_WAY_OFFSET
            : ONE_WAY_OFFSET;

          const offsetX = (-dy / length) * lane;

          const offsetY = (dx / length) * lane;

          // Extend the direction line all the way to each node center.
          // Room/stair/entrance boxes are redrawn on top of the line,
          // so the visible line reaches the exact edge of each box.
          const trimStart = 0;

          const trimEnd = 0;

          const unitX = dx / length;

          const unitY = dy / length;

          const startX = from.x + offsetX + unitX * trimStart;

          const startY = from.y + offsetY + unitY * trimStart;

          const endX = to.x + offsetX - unitX * trimEnd;

          const endY = to.y + offsetY - unitY * trimEnd;

          if (Math.hypot(endX - startX, endY - startY) < 8) {
            return;
          }

          const line = document.createElementNS(svgns, "line");

          line.setAttribute("x1", startX);

          line.setAttribute("y1", startY);

          line.setAttribute("x2", endX);

          line.setAttribute("y2", endY);

          line.setAttribute("stroke", "#f2a93b");

          line.setAttribute("stroke-width", "3.5");

          line.setAttribute("stroke-linecap", "butt");

          line.classList.add("route-line");

          line.addEventListener("click", () => {
            showDestination();
          });

          svg.appendChild(line);

          // Direction arrow is placed at the centre of this route segment.
          const midX = (startX + endX) / 2;
          const midY = (startY + endY) / 2;
          const arrowSize = 13;
          const half = 6.5;
          const px = -unitY;
          const py = unitX;
          const tipX = midX + unitX * arrowSize;
          const tipY = midY + unitY * arrowSize;
          const backX = midX - unitX * 4;
          const backY = midY - unitY * 4;
          const arrow = document.createElementNS(svgns, "polygon");
          arrow.setAttribute(
            "points",
            `${tipX},${tipY} ${backX + px * half},${backY + py * half} ${backX - px * half},${backY - py * half}`,
          );
          arrow.setAttribute("class", "route-line-arrow");
          arrow.style.pointerEvents = "none";
          svg.appendChild(arrow);
        });

        // -----------------------------------------------------
        // 2. Redraw room/stair/entrance boxes on top of the
        //    route lines, so box edges cleanly cover line ends.
        //    This happens BEFORE the transition text below, so
        //    the text is never hidden underneath a box.
        // -----------------------------------------------------

        drawFloorNodes(svg);

        // -----------------------------------------------------
        // 3. Floor/building transition text is drawn LAST, so
        //    it always renders on top and is never covered by
        //    a room/stair/entrance box.
        // -----------------------------------------------------

        // A via-stop can cause the route to revisit the same floor
        // more than once (e.g. climbing past it on the way up, then
        // passing back through it on the way down). Node names like
        // "C-STAIRS-2" then appear more than once in lastPathCoords,
        // so matching by name (or only checking the last occurrence
        // on this floor) picks the wrong occurrence and can drop a
        // needed transition arrow. Check every occurrence on this
        // floor, and use indexOf (object identity) rather than name
        // matching, so each one resolves to its own real position.
        onThisView.forEach((point) => {
          const globalIndex = lastPathCoords.indexOf(point);

          if (globalIndex < 0 || globalIndex >= lastPathCoords.length - 1) {
            return;
          }

          const nextPoint = lastPathCoords[globalIndex + 1];

          if (
            nextPoint.building === currentBuilding &&
            nextPoint.floor !== currentFloor
          ) {
            drawFloorTransition(svg, point, nextPoint.floor);
          }

          if (nextPoint.building !== currentBuilding) {
            drawBuildingTransition(
              svg,
              point,
              nextPoint.building,
              point.next_route_type,
            );
          }
        });

        // -----------------------------------------------------
        // START MARKER
        // -----------------------------------------------------

        const start = lastPathCoords[0];

        if (
          start.building === currentBuilding &&
          start.floor === currentFloor
        ) {
          const startDot = document.createElementNS(svgns, "circle");

          startDot.setAttribute("cx", start.x);

          startDot.setAttribute("cy", start.y);

          startDot.setAttribute("r", "9");

          startDot.setAttribute("fill", "#00d9ff");

          startDot.setAttribute("stroke", "#fff");

          startDot.setAttribute("stroke-width", "2");

          startDot.classList.add("destination-pulse");
          startDot.style.pointerEvents = "none";

          svg.appendChild(startDot);
        }

        // -----------------------------------------------------
        // VIA STOP MARKER
        // -----------------------------------------------------

        onThisView
          .filter((point) => point.is_stop)
          .forEach((stop) => {
            const stopDot = document.createElementNS(svgns, "circle");

            stopDot.setAttribute("cx", stop.x);

            stopDot.setAttribute("cy", stop.y);

            stopDot.setAttribute("r", "8");

            stopDot.setAttribute("fill", "#1fa2a6");

            stopDot.setAttribute("stroke", "white");

            stopDot.setAttribute("stroke-width", "3");

            stopDot.classList.add("stop-marker");

            svg.appendChild(stopDot);
          });

        // -----------------------------------------------------
        // DESTINATION MARKER
        // -----------------------------------------------------

        const destination = lastPathCoords[lastPathCoords.length - 1];

        if (
          destination.building === currentBuilding &&
          destination.floor === currentFloor
        ) {
          const endDot = document.createElementNS(svgns, "circle");

          endDot.setAttribute("cx", destination.x);

          endDot.setAttribute("cy", destination.y);

          endDot.setAttribute("r", "9");

          endDot.setAttribute("fill", "#e15a4c");

          endDot.setAttribute("stroke", "#fff");

          endDot.setAttribute("stroke-width", "2");

          endDot.classList.add("destination-pulse");

          svg.appendChild(endDot);
        }
      }

      // =========================================================
      // NORMAL ARROW CLICK
      // =========================================================

      function showDestination() {
        document.getElementById("navigationMessage").innerText =
          "Continue following the amber arrows toward the red destination.";
      }

      // =========================================================
      // OUTDOOR -> INDOOR
      // =========================================================

      function playZoomTransition(buildingId) {
        const outdoor = document.getElementById("outdoorView");
        const building = campusLayoutData?.buildings?.find(
          (item) => item.id === buildingId,
        );

        if (building) {
          const originX = (building.cx / 1000) * 100;
          const originY = (building.cy / 900) * 100;
          outdoor.style.transformOrigin = `${originX}% ${originY}%`;
        }

        outdoor.classList.add("zoomed");
        document.getElementById("indoorView").classList.add("visible");
      }

      // =========================================================
      // RESET
      // =========================================================

      function resetZoomTransition() {
        const outdoor = document.getElementById("outdoorView");
        outdoor.classList.remove("zoomed");
        outdoor.style.transformOrigin = "20% 20%";

        document.getElementById("indoorView").classList.remove("visible");
      }

      function hideRouteOptions() {
        document.getElementById("routeOptions").style.display = "none";
      }

      function showRouteOptions(modes, selectedMode) {
        const container = document.getElementById("routeOptions");

        if (!modes || modes.length < 2) {
          hideRouteOptions();
          return;
        }

        container.innerHTML = "<strong>Choose your route</strong>";

        const labels = {
          indoor: "Indoor / covered",
          outdoor: "Outdoor walkway",
        };

        modes.forEach((mode) => {
          const button = document.createElement("button");

          button.textContent = labels[mode];

          if (mode === selectedMode) {
            button.classList.add("active");
          }

          button.addEventListener("click", () => findPath(mode));

          container.appendChild(button);
        });

        container.style.display = "block";
      }

      // =========================================================
      // FIND PATH
      // =========================================================

      function findPath(mode = "indoor") {
        selectedRouteMode = mode;

        const from = document.getElementById("from").value.trim();

        const via = document.getElementById("via").value.trim();

        const to = document.getElementById("to").value.trim();

        const resultEl = document.getElementById("result");

        if (!from) {
          hideCurrentLocation();

          hideRouteOptions();

          resultEl.classList.remove("placeholder");

          resultEl.innerText = "Please enter your starting room number.";

          return;
        }

        if (!to) {
          hideCurrentLocation();

          hideRouteOptions();

          resultEl.classList.remove("placeholder");

          resultEl.innerText = "Please enter your destination room number.";

          return;
        }

        let url = `/path?from=${encodeURIComponent(
          from,
        )}&to=${encodeURIComponent(to)}&mode=${encodeURIComponent(mode)}`;

        if (via) {
          url += `&via=${encodeURIComponent(via)}`;
        }

        fetch(url)
          .then((response) => response.json())

          .then((data) => {
            if (data.error) {
              hideCurrentLocation();

              hideRouteOptions();

              resultEl.classList.remove("placeholder");

              resultEl.innerText = "Error: " + data.error;

              resetZoomTransition();

              return;
            }

            if (!data.path_coords || data.path_coords.length === 0) {
              hideCurrentLocation();

              hideRouteOptions();

              resultEl.classList.remove("placeholder");

              resultEl.innerText = "No navigation route was returned.";

              return;
            }

            resultEl.classList.remove("placeholder");

            resultEl.innerText = data.directions.join("\n");

            showRouteOptions(data.available_modes, data.route_mode);

            lastPathCoords = data.path_coords;

            currentBuilding = lastPathCoords[0].building;

            currentFloor = lastPathCoords[0].floor;

            navigationHistory = [];

            updateBackButton();

            updateCurrentLocation();

            document.getElementById("navigationMessage").innerText = "";

            if (mode === "outdoor") {
              // Outdoor navigation belongs on the campus overview.
              // Do not zoom into a floor map; draw the calculated
              // building-to-building route directly on the first page.
              const outdoor = document.getElementById("outdoorView");
              outdoor.classList.remove("zoomed");
              outdoor.style.transformOrigin = "20% 20%";
              document.getElementById("indoorView").classList.remove("visible");
              clearOutdoorRoute();
              highlightOutdoorPath();
              document.getElementById("navigationMessage").innerText =
                "Follow the amber line on the campus map.";
              return;
            }

            const svg = document.getElementById("floorMap");
            svg.style.transform = "translate(0px, 0px) scale(1)";

            renderBuildingTabs();
            renderFloorTabs();
            loadFloor();
            playZoomTransition(currentBuilding);
          })

          .catch((error) => {
            console.error(error);

            hideCurrentLocation();

            resultEl.classList.remove("placeholder");

            resultEl.innerText = "Could not reach server. Is app.py running?";
          });
      }

      // =========================================================
      // INITIALIZE
      // =========================================================

      hideCurrentLocation();

      document.getElementById("result").classList.add("placeholder");

      document.getElementById("backBtn").addEventListener("click", goBack);

      loadBuildings();

      loadCampusLayout();
    </script>
  </body>
</html>
