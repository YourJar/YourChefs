<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIT Vellore — Wayfinder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* =====================================================
         TOKENS
         A drafting-table palette: dark blueprint navy for
         chrome, pale drafting paper for the floor plan itself,
         amber for the marked route (like a highlighter on a
         printed plan).
         ===================================================== */
      :root {
        --ink: #0e1e38;
        --ink-soft: #16305a;
        --ink-line: #2a4a78;
        --paper: #eef3f8;
        --paper-line: #345272;
        --paper-line-soft: #c9d6e5;
        --paper-fill: #e3ebf4;
        --route: #f2a93b;
        --route-deep: #c9861f;
        --destination: #e15a4c;
        --stop: #1fa2a6;
        --text-on-ink: #e9eefb;
        --text-on-ink-dim: #93a6c9;
        --text-on-paper: #1a2c47;
        --font-ui: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font-ui);
        background: var(--ink);
        color: var(--text-on-ink);
        overflow: hidden;
      }

      button,
      input {
        font-family: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--route);
        outline-offset: 2px;
      }

      /* =====================================================
         APP SHELL
         ===================================================== */

      #app {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }

      .app-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--ink-line);
        background: var(--ink);
        z-index: 30;
      }

      .brand-mark {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
      }

      .brand-text h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .brand-text p {
        margin: 1px 0 0;
        font-size: 12px;
        color: var(--text-on-ink-dim);
      }

      #app-content {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
      }

      /* =====================================================
         MAP PANEL
         ===================================================== */

      .map-panel {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        background: var(--paper);
      }

      #mapStage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #outdoorView {
        position: absolute;
        inset: 0;
        background-image: url("/campus_map.png");
        background-size: cover;
        background-position: center;
        transform-origin: 20% 20%;
        transition:
          transform 1.4s ease-in,
          opacity 0.6s ease-in 1s;
      }

      #outdoorView.zoomed {
        transform: scale(6);
        opacity: 0;
      }

      #indoorView {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        background: var(--paper);
        transition: opacity 0.6s ease-in;
      }

      #indoorView.visible {
        opacity: 1;
      }

      .map-toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 6px;
        padding: 12px 14px 10px;
        background: var(--paper);
        border-bottom: 1px solid var(--paper-line-soft);
      }

      .tab-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        padding: 6px 13px;
        border-radius: 7px;
        border: 1px solid var(--paper-line-soft);
        background: #fff;
        color: var(--text-on-paper);
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .tab:hover {
        border-color: var(--route);
      }

      .tab.active {
        background: var(--ink);
        color: var(--text-on-ink);
        border-color: var(--ink);
      }

      .map-canvas {
        flex: 1;
        min-height: 0;
        position: relative;
        background-image:
          linear-gradient(var(--paper-line-soft) 1px, transparent 1px),
          linear-gradient(90deg, var(--paper-line-soft) 1px, transparent 1px);
        background-size: 24px 24px;
        background-position: center;
      }

      #floorMap {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* =====================================================
         SIDEBAR / CARDS
         ===================================================== */

      .sidebar {
        flex: 0 0 380px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        overflow-y: auto;
        background: var(--ink);
        border-left: 1px solid var(--ink-line);
      }

      .card {
        background: var(--ink-soft);
        border: 1px solid var(--ink-line);
        border-radius: 10px;
        padding: 14px 16px;
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--text-on-ink-dim);
        text-transform: uppercase;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 12px;
      }

      .field:last-of-type {
        margin-bottom: 14px;
      }

      .field label {
        font-size: 12.5px;
        color: var(--text-on-ink-dim);
      }

      .field input {
        padding: 9px 10px;
        border-radius: 7px;
        border: 1px solid var(--ink-line);
        background: #0b1830;
        color: var(--text-on-ink);
        font-size: 14px;
      }

      .field input::placeholder {
        color: #5a6f95;
      }

      .field input:focus {
        border-color: var(--route);
      }

      #findPathBtn {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 7px;
        background: var(--route);
        color: #26190a;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      #findPathBtn:hover {
        background: var(--route-deep);
      }

      /* -----------------------------------------------------
         CURRENT LOCATION
         ----------------------------------------------------- */

      #currentLocation {
        display: none;
      }

      #currentBlock {
        font-family: var(--font-mono);
        font-size: 19px;
        font-weight: 600;
        color: var(--route);
      }

      #currentFloor {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--text-on-ink-dim);
        margin-top: 4px;
      }

      /* -----------------------------------------------------
         DIRECTIONS / ROUTE OPTIONS
         ----------------------------------------------------- */

      #routeOptions {
        display: none;
        margin-bottom: 12px;
        font-size: 12.5px;
      }

      #routeOptions strong {
        display: block;
        font-weight: 600;
        color: var(--text-on-ink-dim);
        margin-bottom: 6px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #routeOptions button {
        padding: 6px 12px;
        margin: 0 6px 6px 0;
        border-radius: 6px;
        border: 1px solid var(--ink-line);
        background: #0b1830;
        color: var(--text-on-ink);
        font-size: 12.5px;
        cursor: pointer;
      }

      #routeOptions button.active {
        background: var(--route);
        border-color: var(--route);
        color: #26190a;
        font-weight: 600;
      }

      #result {
        margin: 0;
        white-space: pre-line;
        font-size: 13.5px;
        line-height: 1.65;
        color: var(--text-on-ink);
      }

      #result:empty::before,
      #result.placeholder::before {
        content: "Enter a starting room and a destination to get turn-by-turn directions.";
        color: var(--text-on-ink-dim);
      }

      #navigationMessage {
        margin: 10px 0 0;
        font-size: 12.5px;
        color: var(--stop);
        min-height: 1em;
      }

      /* =====================================================
         SVG CONTENT (drawn by JS, classes styled here)
         ===================================================== */

      .room-square {
        cursor: pointer;
        transition: fill 0.1s ease;
      }

      .room-square:hover {
        fill: #fde8c2 !important;
        stroke: var(--route) !important;
      }

      .route-line {
        cursor: pointer;
        pointer-events: stroke;
        stroke-linecap: square;
      }

      .route-line:hover {
        stroke-width: 5;
      }

      .floor-transition {
        cursor: pointer;
      }

      .floor-transition:hover {
        opacity: 0.75;
      }

      .floor-transition-line {
        stroke: var(--route);
        stroke-width: 3;
        stroke-linecap: square;
      }

      .floor-transition-text {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        fill: var(--route-deep);
        text-anchor: middle;
      }

      .destination-pulse {
        animation: destinationPulse 1.2s infinite;
      }

      @keyframes destinationPulse {
        0% {
          r: 9;
          opacity: 1;
        }
        50% {
          r: 15;
          opacity: 0.45;
        }
        100% {
          r: 9;
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #outdoorView,
        #indoorView {
          transition: none !important;
        }
        .destination-pulse {
          animation: none;
        }
      }

      /* =====================================================
         RESPONSIVE: below ~880px the sidebar becomes a
         bottom sheet floating over a full-bleed map, matching
         the conventions of a mobile navigation app.
         ===================================================== */

      @media (max-width: 880px) {
        .app-header {
          padding: 12px 16px;
        }

        #app-content {
          display: block;
        }

        .map-panel {
          position: absolute;
          inset: 0;
        }

        .sidebar {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          flex: none;
          max-height: 62dvh;
          border-left: none;
          border-top: 1px solid var(--ink-line);
          border-radius: 16px 16px 0 0;
          box-shadow: 0 -8px 24px rgba(4, 10, 24, 0.45);
        }

        .sidebar::before {
          content: "";
          display: block;
          width: 36px;
          height: 4px;
          border-radius: 2px;
          background: var(--ink-line);
          margin: 2px auto 10px;
        }
      }

      @media (min-width: 881px) {
        .sidebar {
          height: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <!-- ===================================================
           HEADER
           =================================================== -->

      <header class="app-header">
        <svg
          class="brand-mark"
          viewBox="0 0 32 32"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z"
            stroke="#f2a93b"
            stroke-width="2"
          />
          <circle cx="16" cy="16" r="3" fill="#f2a93b" />
        </svg>
        <div class="brand-text">
          <h1>VIT Vellore</h1>
          <p>Campus wayfinder</p>
        </div>
      </header>

      <!-- ===================================================
           CONTENT
           =================================================== -->

      <div id="app-content">
        <div class="map-panel">
          <div id="mapStage">
            <div id="outdoorView"></div>

            <div id="indoorView">
              <div class="map-toolbar">
                <div id="buildingTabs" class="tab-row"></div>
                <div id="floorTabs" class="tab-row"></div>
              </div>

              <div class="map-canvas">
                <svg
                  id="floorMap"
                  viewBox="0 0 480 340"
                  preserveAspectRatio="xMidYMid meet"
                ></svg>
              </div>
            </div>
          </div>
        </div>

        <aside class="sidebar">
          <div class="card">
            <h2>Plan a route</h2>

            <div class="field">
              <label for="from">From</label>
              <input id="from" placeholder="e.g. 43" />
            </div>

            <div class="field">
              <label for="via">Stop (optional)</label>
              <input id="via" placeholder="e.g. 118" />
            </div>

            <div class="field">
              <label for="to">To</label>
              <input id="to" placeholder="e.g. 101" />
            </div>

            <button id="findPathBtn" onclick="findPath()">Find route</button>
          </div>

          <div class="card" id="currentLocation">
            <h2>Current location</h2>
            <div id="currentBlock">Current Block:</div>
            <div id="currentFloor">Current Floor:</div>
          </div>

          <div class="card">
            <h2>Directions</h2>
            <div id="routeOptions"></div>
            <p id="result"></p>
            <p id="navigationMessage"></p>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const svgns = "http://www.w3.org/2000/svg";

      let floorNodes = {};

      let floorEdges = [];

      let currentBuilding = null;

      let currentFloor = null;

      let lastPathCoords = [];

      let buildingLayout = {};

      let selectedRouteMode = "indoor";

      const buildingLabels = {
        A: "A Block",

        B: "B Block",

        C: "C Block",

        D: "D Block",

        E: "E Block",
      };

      // =========================================================
      // FLOOR NAME
      // =========================================================

      function getFloorName(floor) {
        if (floor === 0) {
          return "Ground Floor";
        }

        if (floor === 1) {
          return "1st Floor";
        }

        if (floor === 2) {
          return "2nd Floor";
        }

        if (floor === 3) {
          return "3rd Floor";
        }

        return floor + "th Floor";
      }

      // =========================================================
      // CURRENT LOCATION
      // =========================================================

      function updateCurrentLocation() {
        if (!currentBuilding || currentFloor === null) {
          document.getElementById("currentLocation").style.display = "none";

          return;
        }

        document.getElementById("currentBlock").innerText =
          "Current Block: " +
          (buildingLabels[currentBuilding] || currentBuilding);

        document.getElementById("currentFloor").innerText =
          "Current Floor: " + getFloorName(currentFloor);

        document.getElementById("currentLocation").style.display = "block";
      }

      // =========================================================
      // HIDE LOCATION
      // =========================================================

      function hideCurrentLocation() {
        document.getElementById("currentLocation").style.display = "none";
      }

      // =========================================================
      // LOAD BUILDINGS
      // =========================================================

      function loadBuildings() {
        fetch("/buildings")
          .then((response) => response.json())

          .then((data) => {
            buildingLayout = data;

            currentBuilding = null;

            currentFloor = null;

            hideCurrentLocation();

            document.getElementById("buildingTabs").innerHTML = "";

            document.getElementById("floorTabs").innerHTML = "";
          });
      }

      // =========================================================
      // BUILDING TABS
      // =========================================================

      function renderBuildingTabs() {
        const container = document.getElementById("buildingTabs");

        container.innerHTML = "";

        if (!currentBuilding) {
          return;
        }

        Object.keys(buildingLayout).forEach((buildingId) => {
          const tab = document.createElement("span");

          tab.className =
            "tab" + (buildingId === currentBuilding ? " active" : "");

          tab.textContent = buildingLabels[buildingId];

          tab.onclick = () => {
            currentBuilding = buildingId;

            currentFloor = buildingLayout[buildingId][0];

            updateCurrentLocation();

            renderBuildingTabs();

            renderFloorTabs();

            loadFloor();
          };

          container.appendChild(tab);
        });
      }

      // =========================================================
      // FLOOR TABS
      // =========================================================

      function renderFloorTabs() {
        const container = document.getElementById("floorTabs");

        container.innerHTML = "";

        if (!currentBuilding) {
          return;
        }

        const floors = buildingLayout[currentBuilding] || [];

        floors.forEach((floorNum) => {
          const tab = document.createElement("span");

          tab.className = "tab" + (floorNum === currentFloor ? " active" : "");

          tab.textContent = getFloorName(floorNum);

          tab.onclick = () => {
            currentFloor = floorNum;

            updateCurrentLocation();

            renderFloorTabs();

            loadFloor();
          };

          container.appendChild(tab);
        });
      }

      // =========================================================
      // LOAD FLOOR
      // =========================================================

      function loadFloor() {
        if (!currentBuilding || currentFloor === null) {
          return;
        }

        fetch(
          `/floor?building=${encodeURIComponent(
            currentBuilding,
          )}&floor=${currentFloor}`,
        )
          .then((response) => response.json())

          .then((data) => {
            if (data.error) {
              console.error(data.error);

              return;
            }

            floorNodes = {};

            data.nodes.forEach((node) => {
              floorNodes[node.name] = {
                x: node.x,

                y: node.y,

                type: node.type,

                room_number: node.room_number,
              };
            });

            floorEdges = data.edges;

            drawBaseMap();

            if (lastPathCoords.length > 0) {
              highlightPathOnCurrentView();
            }
          });
      }

      // =========================================================
      // DRAW BASE MAP
      // =========================================================

      function drawBaseMap() {
        const svg = document.getElementById("floorMap");

        svg.innerHTML = "";

        svg.style.transform = "translate(0px, 0px) scale(1)";

        // -----------------------------------------------------
        // CORRIDORS
        // -----------------------------------------------------

        floorEdges.forEach((edge) => {
          const a = floorNodes[edge.from];

          const b = floorNodes[edge.to];

          if (!a || !b) {
            return;
          }

          const line = document.createElementNS(svgns, "line");

          line.setAttribute("x1", a.x);

          line.setAttribute("y1", a.y);

          line.setAttribute("x2", b.x);

          line.setAttribute("y2", b.y);

          line.setAttribute("stroke", "#c9d6e5");

          line.setAttribute("stroke-width", "4");

          line.setAttribute("stroke-linecap", "square");

          svg.appendChild(line);
        });

        drawFloorNodes(svg);
      }

      // =========================================================
      // DRAW ROOM / STAIR / ENTRANCE NODES
      // Drawn again after the route so boxes cover line ends.
      // =========================================================

      function drawFloorNodes(svg) {
        Object.entries(floorNodes).forEach(([name, pos]) => {
          // ===============================================
          // ROOM
          // ===============================================

          if (pos.type === "room") {
            const square = document.createElementNS(svgns, "rect");

            square.setAttribute("x", pos.x - 12);

            square.setAttribute("y", pos.y - 12);

            square.setAttribute("width", "24");

            square.setAttribute("height", "24");

            square.setAttribute("rx", "3");

            square.setAttribute("fill", "#e3ebf4");

            square.setAttribute("stroke", "#345272");

            square.setAttribute("stroke-width", "1.25");

            square.classList.add("room-square");

            svg.appendChild(square);

            // -------------------------------------------
            // ROOM NUMBER INSIDE SQUARE
            // -------------------------------------------

            const label = document.createElementNS(svgns, "text");

            label.setAttribute("x", pos.x);

            label.setAttribute("y", pos.y);

            label.setAttribute("text-anchor", "middle");

            label.setAttribute("dominant-baseline", "central");

            label.setAttribute("font-family", "IBM Plex Mono, monospace");

            label.setAttribute("font-size", "8.5");

            label.setAttribute("font-weight", "600");

            label.setAttribute("fill", "#1a2c47");

            label.textContent = pos.room_number;

            svg.appendChild(label);
          }

          // ===============================================
          // STAIRCASE
          // ===============================================
          else if (pos.type === "stairs") {
            const stair = document.createElementNS(svgns, "rect");

            stair.setAttribute("x", pos.x - 14);

            stair.setAttribute("y", pos.y - 14);

            stair.setAttribute("width", "28");

            stair.setAttribute("height", "28");

            stair.setAttribute("rx", "3");

            stair.setAttribute("fill", "#f6e7c4");

            stair.setAttribute("stroke", "#8c6d1f");

            stair.setAttribute("stroke-width", "1.5");

            svg.appendChild(stair);

            const label = document.createElementNS(svgns, "text");

            label.setAttribute("x", pos.x);

            label.setAttribute("y", pos.y + 30);

            label.setAttribute("text-anchor", "middle");

            label.setAttribute("font-family", "IBM Plex Mono, monospace");

            label.setAttribute("font-size", "8.5");

            label.setAttribute("font-weight", "600");

            label.setAttribute("fill", "#5b4712");

            label.textContent = "STAIRS";

            svg.appendChild(label);
          }

          // ===============================================
          // ENTRANCE
          // ===============================================
          else if (pos.type === "entrance") {
            const entrance = document.createElementNS(svgns, "rect");

            entrance.setAttribute("x", pos.x - 12);

            entrance.setAttribute("y", pos.y - 12);

            entrance.setAttribute("width", "24");

            entrance.setAttribute("height", "24");

            entrance.setAttribute("rx", "3");

            entrance.setAttribute("fill", "#dceee0");

            entrance.setAttribute("stroke", "#2f7a4d");

            entrance.setAttribute("stroke-width", "1.5");

            svg.appendChild(entrance);

            const label = document.createElementNS(svgns, "text");

            label.setAttribute("x", pos.x + 25);

            label.setAttribute("y", pos.y + 4);

            label.setAttribute("font-family", "Space Grotesk, sans-serif");

            label.setAttribute("font-size", "10");

            label.setAttribute("fill", "#1a2c47");

            label.textContent = "Entrance";

            svg.appendChild(label);
          }
        });
      }

      // =========================================================
      // ARROW MARKER
      // =========================================================

      function createRouteArrowMarker(svg) {
        if (svg.querySelector("#routeArrow")) {
          return;
        }

        const defs = document.createElementNS(svgns, "defs");

        const marker = document.createElementNS(svgns, "marker");

        marker.setAttribute("id", "routeArrow");

        marker.setAttribute("markerWidth", "10");

        marker.setAttribute("markerHeight", "10");

        marker.setAttribute("refX", "10");

        marker.setAttribute("refY", "5");

        marker.setAttribute("viewBox", "0 0 10 10");

        marker.setAttribute("orient", "auto");

        marker.setAttribute("markerUnits", "userSpaceOnUse");

        const arrow = document.createElementNS(svgns, "path");

        arrow.setAttribute("d", "M0,1.5 L10,5 L0,8.5 Z");

        arrow.setAttribute("fill", "#f2a93b");

        marker.appendChild(arrow);

        defs.appendChild(marker);

        svg.appendChild(defs);
      }

      function pointKey(point) {
        if (point && point.name) {
          return String(point.name);
        }

        return Math.round(point.x) + "," + Math.round(point.y);
      }

      function corridorKey(a, b) {
        const left = pointKey(a);

        const right = pointKey(b);

        return left < right ? left + "::" + right : right + "::" + left;
      }

      function isCanonicalDirection(from, to) {
        const dx = to.x - from.x;

        const dy = to.y - from.y;

        if (Math.abs(dx) >= Math.abs(dy)) {
          return dx > 0 || (dx === 0 && dy >= 0);
        }

        return dy > 0;
      }

      // =========================================================
      // DRAW FLOOR TRANSITION
      // =========================================================

      function drawFloorTransition(svg, point, nextFloor) {
        const direction = nextFloor > currentFloor ? 1 : -1;

        const arrowLength = 45;

        const x = point.x;

        const startY = point.y;

        const endY = point.y - direction * arrowLength;

        const line = document.createElementNS(svgns, "line");

        line.setAttribute("x1", x);

        line.setAttribute("y1", startY);

        line.setAttribute("x2", x);

        line.setAttribute("y2", endY);

        line.setAttribute("class", "floor-transition-line");

        line.setAttribute("marker-end", "url(#routeArrow)");

        svg.appendChild(line);

        const text = document.createElementNS(svgns, "text");

        text.setAttribute("x", x + 28);

        text.setAttribute("y", endY + 4);

        text.setAttribute("class", "floor-transition-text");

        text.textContent = `Go to ${getFloorName(nextFloor)}`;

        svg.appendChild(text);

        const group = document.createElementNS(svgns, "g");

        group.classList.add("floor-transition");

        group.addEventListener("click", () => {
          moveToFloor(nextFloor);
        });

        const hitArea = document.createElementNS(svgns, "rect");

        hitArea.setAttribute("x", x - 25);

        hitArea.setAttribute("y", Math.min(startY, endY) - 10);

        hitArea.setAttribute("width", "50");

        hitArea.setAttribute("height", Math.abs(endY - startY) + 20);

        hitArea.setAttribute("fill", "transparent");

        group.appendChild(hitArea);

        svg.appendChild(group);
      }

      // =========================================================
      // MOVE TO NEXT FLOOR
      // =========================================================

      function moveToFloor(nextFloor) {
        currentFloor = nextFloor;

        updateCurrentLocation();

        renderFloorTabs();

        loadFloor();

        document.getElementById("navigationMessage").innerText =
          `Moved to ${getFloorName(nextFloor)}.`;
      }

      // =========================================================
      // OUTDOOR BUILDING TRANSITION
      // =========================================================

      function drawBuildingTransition(svg, point, nextBuilding, routeType) {
        const endX = point.x + 68;

        const line = document.createElementNS(svgns, "line");

        line.setAttribute("x1", point.x);
        line.setAttribute("y1", point.y);
        line.setAttribute("x2", endX);
        line.setAttribute("y2", point.y);
        line.setAttribute("class", "floor-transition-line");
        line.setAttribute("marker-end", "url(#routeArrow)");

        svg.appendChild(line);

        const text = document.createElementNS(svgns, "text");

        text.setAttribute("x", endX + 85);
        text.setAttribute("y", point.y - 8);
        text.setAttribute("class", "floor-transition-text");
        text.textContent =
          routeType === "covered"
            ? `Continue indoors to ${buildingLabels[nextBuilding]}`
            : `Walk outside to ${buildingLabels[nextBuilding]}`;

        svg.appendChild(text);

        const group = document.createElementNS(svgns, "g");

        group.classList.add("floor-transition");
        group.addEventListener("click", () => {
          moveToBuilding(nextBuilding);
        });

        const hitArea = document.createElementNS(svgns, "rect");

        hitArea.setAttribute("x", point.x - 12);
        hitArea.setAttribute("y", point.y - 26);
        hitArea.setAttribute("width", 250);
        hitArea.setAttribute("height", 48);
        hitArea.setAttribute("fill", "transparent");

        group.appendChild(hitArea);
        svg.appendChild(group);
      }

      function moveToBuilding(nextBuilding) {
        const nextPoint = lastPathCoords.find(
          (point) => point.building === nextBuilding,
        );

        currentBuilding = nextBuilding;
        currentFloor = nextPoint ? nextPoint.floor : 0;

        updateCurrentLocation();
        renderBuildingTabs();
        renderFloorTabs();
        loadFloor();

        document.getElementById("navigationMessage").innerText =
          `Moved outside to ${buildingLabels[nextBuilding]}.`;
      }

      // =========================================================
      // DRAW ROUTE
      // =========================================================

      function highlightPathOnCurrentView() {
        const svg = document.getElementById("floorMap");

        const onThisView = lastPathCoords.filter(
          (p) => p.building === currentBuilding && p.floor === currentFloor,
        );

        if (onThisView.length === 0) {
          return;
        }

        createRouteArrowMarker(svg);

        const segmentTotals = {};

        const sameFloorSegments = [];

        for (let i = 0; i < onThisView.length - 1; i++) {
          const from = onThisView[i];

          const to = onThisView[i + 1];

          if (from.building !== to.building || from.floor !== to.floor) {
            continue;
          }

          const key = corridorKey(from, to);

          segmentTotals[key] = (segmentTotals[key] || 0) + 1;

          sameFloorSegments.push({ from, to, key });
        }

        const ONE_WAY_OFFSET = 7;

        const TWO_WAY_OFFSET = 11;

        // -----------------------------------------------------
        // 1. Draw route line segments.
        // -----------------------------------------------------

        sameFloorSegments.forEach((segment) => {
          const from = segment.from;

          const to = segment.to;

          const dx = to.x - from.x;

          const dy = to.y - from.y;

          const length = Math.sqrt(dx * dx + dy * dy) || 1;

          const isTwoWay = segmentTotals[segment.key] > 1;

          const forward = isCanonicalDirection(from, to);

          const lane = isTwoWay
            ? forward
              ? TWO_WAY_OFFSET
              : -TWO_WAY_OFFSET
            : ONE_WAY_OFFSET;

          const offsetX = (-dy / length) * lane;

          const offsetY = (dx / length) * lane;

          const nodePad = 14;

          const headPad = 10;

          const maxTrim = Math.max(0, (length - 18) / 2);

          const trimStart = Math.min(nodePad, maxTrim);

          const trimEnd = Math.min(nodePad + headPad, maxTrim);

          const unitX = dx / length;

          const unitY = dy / length;

          const startX = from.x + offsetX + unitX * trimStart;

          const startY = from.y + offsetY + unitY * trimStart;

          const endX = to.x + offsetX - unitX * trimEnd;

          const endY = to.y + offsetY - unitY * trimEnd;

          if (Math.hypot(endX - startX, endY - startY) < 8) {
            return;
          }

          const line = document.createElementNS(svgns, "line");

          line.setAttribute("x1", startX);

          line.setAttribute("y1", startY);

          line.setAttribute("x2", endX);

          line.setAttribute("y2", endY);

          line.setAttribute("stroke", "#f2a93b");

          line.setAttribute("stroke-width", "2.5");

          line.setAttribute("stroke-linecap", "butt");

          line.setAttribute("marker-end", "url(#routeArrow)");

          line.classList.add("route-line");

          line.addEventListener("click", () => {
            showDestination();
          });

          svg.appendChild(line);
        });

        // -----------------------------------------------------
        // 2. Redraw room/stair/entrance boxes on top of the
        //    route lines, so box edges cleanly cover line ends.
        //    This happens BEFORE the transition text below, so
        //    the text is never hidden underneath a box.
        // -----------------------------------------------------

        drawFloorNodes(svg);

        // -----------------------------------------------------
        // 3. Floor/building transition text is drawn LAST, so
        //    it always renders on top and is never covered by
        //    a room/stair/entrance box.
        // -----------------------------------------------------

        const lastVisible = onThisView[onThisView.length - 1];

        const globalIndex = lastPathCoords.findIndex(
          (p) => p.name === lastVisible.name,
        );

        if (globalIndex >= 0 && globalIndex < lastPathCoords.length - 1) {
          const nextPoint = lastPathCoords[globalIndex + 1];

          if (
            nextPoint.building === currentBuilding &&
            nextPoint.floor !== currentFloor
          ) {
            drawFloorTransition(svg, lastVisible, nextPoint.floor);
          }

          if (nextPoint.building !== currentBuilding) {
            drawBuildingTransition(
              svg,
              lastVisible,
              nextPoint.building,
              lastVisible.next_route_type,
            );
          }
        }

        // -----------------------------------------------------
        // START MARKER
        // -----------------------------------------------------

        const start = lastPathCoords[0];

        if (
          start.building === currentBuilding &&
          start.floor === currentFloor
        ) {
          const startDot = document.createElementNS(svgns, "circle");

          startDot.setAttribute("cx", start.x);

          startDot.setAttribute("cy", start.y);

          startDot.setAttribute("r", "9");

          startDot.setAttribute("fill", "#f2a93b");

          startDot.setAttribute("stroke", "#fff");

          startDot.setAttribute("stroke-width", "2");

          svg.appendChild(startDot);
        }

        // -----------------------------------------------------
        // VIA STOP MARKER
        // -----------------------------------------------------

        onThisView
          .filter((point) => point.is_stop)
          .forEach((stop) => {
            const stopDot = document.createElementNS(svgns, "circle");

            stopDot.setAttribute("cx", stop.x);

            stopDot.setAttribute("cy", stop.y);

            stopDot.setAttribute("r", "8");

            stopDot.setAttribute("fill", "#1fa2a6");

            stopDot.setAttribute("stroke", "white");

            stopDot.setAttribute("stroke-width", "3");

            stopDot.classList.add("stop-marker");

            svg.appendChild(stopDot);
          });

        // -----------------------------------------------------
        // DESTINATION MARKER
        // -----------------------------------------------------

        const destination = lastPathCoords[lastPathCoords.length - 1];

        if (
          destination.building === currentBuilding &&
          destination.floor === currentFloor
        ) {
          const endDot = document.createElementNS(svgns, "circle");

          endDot.setAttribute("cx", destination.x);

          endDot.setAttribute("cy", destination.y);

          endDot.setAttribute("r", "9");

          endDot.setAttribute("fill", "#e15a4c");

          endDot.setAttribute("stroke", "#fff");

          endDot.setAttribute("stroke-width", "2");

          endDot.classList.add("destination-pulse");

          svg.appendChild(endDot);
        }
      }

      // =========================================================
      // NORMAL ARROW CLICK
      // =========================================================

      function showDestination() {
        document.getElementById("navigationMessage").innerText =
          "Continue following the amber arrows toward the red destination.";
      }

      // =========================================================
      // OUTDOOR -> INDOOR
      // =========================================================

      function playZoomTransition() {
        document.getElementById("outdoorView").classList.add("zoomed");

        document.getElementById("indoorView").classList.add("visible");
      }

      // =========================================================
      // RESET
      // =========================================================

      function resetZoomTransition() {
        document.getElementById("outdoorView").classList.remove("zoomed");

        document.getElementById("indoorView").classList.remove("visible");
      }

      function hideRouteOptions() {
        document.getElementById("routeOptions").style.display = "none";
      }

      function showRouteOptions(modes, selectedMode) {
        const container = document.getElementById("routeOptions");

        if (!modes || modes.length < 2) {
          hideRouteOptions();
          return;
        }

        container.innerHTML = "<strong>Choose your route</strong>";

        const labels = {
          indoor: "Indoor / covered",
          outdoor: "Outdoor walkway",
        };

        modes.forEach((mode) => {
          const button = document.createElement("button");

          button.textContent = labels[mode];

          if (mode === selectedMode) {
            button.classList.add("active");
          }

          button.addEventListener("click", () => findPath(mode));

          container.appendChild(button);
        });

        container.style.display = "block";
      }

      // =========================================================
      // FIND PATH
      // =========================================================

      function findPath(mode = "indoor") {
        selectedRouteMode = mode;

        const from = document.getElementById("from").value.trim();

        const via = document.getElementById("via").value.trim();

        const to = document.getElementById("to").value.trim();

        const resultEl = document.getElementById("result");

        if (!from) {
          hideCurrentLocation();

          hideRouteOptions();

          resultEl.classList.remove("placeholder");

          resultEl.innerText = "Please enter your starting room number.";

          return;
        }

        if (!to) {
          hideCurrentLocation();

          hideRouteOptions();

          resultEl.classList.remove("placeholder");

          resultEl.innerText = "Please enter your destination room number.";

          return;
        }

        let url = `/path?from=${encodeURIComponent(
          from,
        )}&to=${encodeURIComponent(to)}&mode=${encodeURIComponent(mode)}`;

        if (via) {
          url += `&via=${encodeURIComponent(via)}`;
        }

        fetch(url)
          .then((response) => response.json())

          .then((data) => {
            if (data.error) {
              hideCurrentLocation();

              hideRouteOptions();

              resultEl.classList.remove("placeholder");

              resultEl.innerText = "Error: " + data.error;

              resetZoomTransition();

              return;
            }

            if (!data.path_coords || data.path_coords.length === 0) {
              hideCurrentLocation();

              hideRouteOptions();

              resultEl.classList.remove("placeholder");

              resultEl.innerText = "No navigation route was returned.";

              return;
            }

            resultEl.classList.remove("placeholder");

            resultEl.innerText = data.directions.join("\n");

            showRouteOptions(data.available_modes, data.route_mode);

            lastPathCoords = data.path_coords;

            currentBuilding = lastPathCoords[0].building;

            currentFloor = lastPathCoords[0].floor;

            updateCurrentLocation();

            const svg = document.getElementById("floorMap");

            svg.style.transform = "translate(0px, 0px) scale(1)";

            document.getElementById("navigationMessage").innerText = "";

            renderBuildingTabs();

            renderFloorTabs();

            loadFloor();

            playZoomTransition();
          })

          .catch((error) => {
            console.error(error);

            hideCurrentLocation();

            resultEl.classList.remove("placeholder");

            resultEl.innerText = "Could not reach server. Is app.py running?";
          });
      }

      // =========================================================
      // INITIALIZE
      // =========================================================

      hideCurrentLocation();

      document.getElementById("result").classList.add("placeholder");

      loadBuildings();
    </script>
  </body>
</html>
